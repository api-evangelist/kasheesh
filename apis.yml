name: Kasheesh
description: >-
  Kasheesh is a consumer fintech platform that lets people split a single
  purchase across up to five credit and debit cards in one transaction. Instead
  of a traditional buy-now-pay-later loan, Kasheesh combines the funds and credit
  a customer already holds into a single digital Kasheesh Card that works at any
  Mastercard-accepting merchant online or in-store via tap-to-pay. The service
  charges a flat service fee, returns card rewards on spend, and requires no
  sign-up fee or credit check. Kasheesh is offered through iOS and Android apps
  and a web app, targeting everyday shopping, bill payment, and rent. It was added
  to the API Evangelist network as a portfolio company of Anthemis; it does not
  currently publish a public developer program, API documentation, or SDKs.
